services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matin-resume-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matin-resume-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - PORT=3000
      - API_INTERNAL_URL=http://backend:5000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  backend_data:
