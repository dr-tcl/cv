services:
  resume:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matin-resume
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - resume_data:/app/data

volumes:
  resume_data:
